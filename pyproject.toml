[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probstar_rv"
version = "1.0.0"
description = "Perception-based quantitative runtime verification for learning-enabled CPS (ProbStar reachability), after Brown et al., ICCPS '25."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CS637 course project" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["probstar_rv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
